name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Habits
        2. Tap + on "Drink water"
        3. …
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - Android
        - Mac
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system version
      placeholder: e.g. Galaxy S25, Android 16 — or MacBook Air M1, macOS 15.7
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dayline version
      description: "Android: Settings → About. Mac: Dayline → About Dayline. Or the release you installed."
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag images or videos here if they help explain the problem.
